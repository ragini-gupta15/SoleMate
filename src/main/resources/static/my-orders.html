<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders — SoleMate</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f7f7f5;

            color: #111;

            min-height: 100vh;
        }


        /* =================================================
           NAVBAR
           ================================================= */

        .navbar {
            height: 76px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            background: rgba(255, 255, 255, 0.92);

            border-bottom:
                1px solid #e8e8e8;

            position: sticky;

            top: 0;

            z-index: 20;

            backdrop-filter: blur(12px);
        }


        .brand {
            font-size: 22px;

            font-weight: 800;

            letter-spacing: -0.04em;

            text-decoration: none;

            color: #111;
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 28px;
        }


        .nav-links a {
            text-decoration: none;

            color: #555;

            font-size: 14px;

            font-weight: 600;
        }


        .nav-links a:hover {
            color: #111;
        }


        /* =================================================
           PAGE
           ================================================= */

        .orders-page {
            width: min(1000px, 90%);

            margin: 80px auto;
        }


        .eyebrow {
            display: block;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.14em;

            color: #777;

            margin-bottom: 12px;
        }


        .page-title {
            font-size: clamp(42px, 7vw, 72px);

            line-height: 0.95;

            letter-spacing: -0.06em;

            margin-bottom: 18px;
        }


        .page-subtitle {
            color: #666;

            font-size: 17px;

            line-height: 1.6;

            max-width: 620px;

            margin-bottom: 44px;
        }


        /* =================================================
           SEARCH
           ================================================= */

        .search-card {
            background: #fff;

            border:
                1px solid #e5e5e5;

            border-radius: 22px;

            padding: 24px;

            margin-bottom: 34px;

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.04);
        }


        .search-row {
            display: flex;

            gap: 12px;
        }


        .email-input {
            flex: 1;

            height: 54px;

            border:
                1px solid #d9d9d9;

            border-radius: 12px;

            padding: 0 16px;

            font-size: 15px;

            outline: none;
        }


        .email-input:focus {
            border-color: #111;

            box-shadow:
                0 0 0 3px
                rgba(0, 0, 0, 0.06);
        }


        .find-button {
            height: 54px;

            padding: 0 28px;

            border: none;

            border-radius: 12px;

            background: #111;

            color: #fff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;
        }


        .find-button:hover {
            background: #2a2a2a;
        }


        /* =================================================
           STATUS MESSAGE
           ================================================= */

        .message {
            display: none;

            padding: 18px;

            border-radius: 14px;

            background: #fff;

            border:
                1px solid #e5e5e5;

            color: #666;

            margin-bottom: 24px;
        }


        .message.visible {
            display: block;
        }


        /* =================================================
           ORDER CARD
           ================================================= */

        .orders-list {
            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .order-card {
            background: #fff;

            border:
                1px solid #e5e5e5;

            border-radius: 22px;

            padding: 26px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .order-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 40px
                rgba(0, 0, 0, 0.06);
        }


        .order-card-top {
            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            padding-bottom: 22px;

            border-bottom:
                1px solid #eeeeee;
        }


        .order-number {
            font-size: 18px;

            font-weight: 800;

            margin-bottom: 7px;
        }


        .order-date {
            color: #777;

            font-size: 13px;
        }


        .status-badge {
            display: inline-flex;

            align-items: center;

            padding: 7px 12px;

            border-radius: 999px;

            background: #f1f1f1;

            font-size: 12px;

            font-weight: 700;
        }


        .order-card-middle {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            padding: 22px 0;
        }


        .items-preview {
            color: #555;

            font-size: 14px;

            line-height: 1.6;
        }


        .order-total {
            font-size: 22px;

            font-weight: 800;

            white-space: nowrap;
        }


        .order-card-bottom {
            display: flex;

            justify-content: flex-end;

            padding-top: 18px;

            border-top:
                1px solid #eeeeee;
        }


        .track-button {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 11px 18px;

            border-radius: 10px;

            background: #111;

            color: #fff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;
        }


        .track-button:hover {
            background: #292929;
        }


        /* =================================================
           EMPTY STATE
           ================================================= */

        .empty-state {
            background: #fff;

            border:
                1px solid #e5e5e5;

            border-radius: 22px;

            padding: 60px 30px;

            text-align: center;
        }


        .empty-state h2 {
            font-size: 28px;

            margin-bottom: 10px;
        }


        .empty-state p {
            color: #777;

            margin-bottom: 24px;
        }


        .shop-button {
            display: inline-block;

            padding: 12px 20px;

            border-radius: 10px;

            background: #111;

            color: #fff;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;
        }


        /* =================================================
           RESPONSIVE
           ================================================= */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 5%;
            }


            .nav-links {
                gap: 14px;
            }


            .orders-page {
                margin: 50px auto;
            }


            .search-row {
                flex-direction: column;
            }


            .find-button {
                width: 100%;
            }


            .order-card-middle {
                flex-direction: column;

                align-items: flex-start;
            }


            .order-card-bottom {
                justify-content: stretch;
            }


            .track-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         NAVIGATION
         ================================================= -->

    <nav class="navbar">

        <a
            href="/"
            class="brand"
        >
            SoleMate
        </a>


        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/shop.html">
                Shop
            </a>

            <a href="/cart.html">
                Bag
            </a>

        </div>

    </nav>



    <!-- =================================================
         MAIN CONTENT
         ================================================= -->

    <main class="orders-page">

        <span class="eyebrow">
            ORDER HISTORY
        </span>


        <h1 class="page-title">
            My Orders
        </h1>


        <p class="page-subtitle">
            Enter the email address used during checkout
            to view your SoleMate orders and track their
            delivery status.
        </p>



        <!-- =================================================
             SEARCH CARD
             ================================================= -->

        <section class="search-card">

            <div class="search-row">

                <input
                    type="email"
                    id="emailInput"
                    class="email-input"
                    placeholder="Enter your email address"
                    autocomplete="email"
                >


                <button
                    class="find-button"
                    id="findOrdersButton"
                >
                    Find Orders
                </button>

            </div>

        </section>



        <!-- =================================================
             MESSAGE
             ================================================= -->

        <div
            class="message"
            id="message"
        ></div>



        <!-- =================================================
             ORDERS
             ================================================= -->

        <section
            class="orders-list"
            id="ordersList"
        >

        </section>

    </main>



    <script>

        /* =================================================
           ELEMENTS
           ================================================= */

        const emailInput =
            document.getElementById(
                "emailInput"
            );


        const findOrdersButton =
            document.getElementById(
                "findOrdersButton"
            );


        const ordersList =
            document.getElementById(
                "ordersList"
            );


        const message =
            document.getElementById(
                "message"
            );



        /* =================================================
           FORMAT MONEY
           ================================================= */

        function formatAmount(amount) {

            return Number(amount || 0)
                .toLocaleString(
                    "en-IN",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );

        }



        /* =================================================
           FORMAT STATUS
           ================================================= */

        function formatStatus(status) {

            if (!status) {
                return "Unknown";
            }


            return status
                .toLowerCase()
                .split("_")
                .map(word =>
                    word.charAt(0).toUpperCase()
                    + word.slice(1)
                )
                .join(" ");

        }



        /* =================================================
           FORMAT DATE
           ================================================= */

        function formatDate(dateString) {

            if (!dateString) {
                return "Date unavailable";
            }


            const date =
                new Date(dateString);


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }



        /* =================================================
           SHOW MESSAGE
           ================================================= */

        function showMessage(text) {

            message.textContent = text;

            message.classList.add(
                "visible"
            );

        }


        function hideMessage() {

            message.textContent = "";

            message.classList.remove(
                "visible"
            );

        }



        /* =================================================
           LOAD ORDERS
           ================================================= */

        async function loadOrders() {

            const email =
                emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Please enter your email address."
                );

                return;
            }


            hideMessage();


            ordersList.innerHTML = "";


            findOrdersButton.disabled = true;

            findOrdersButton.textContent =
                "Finding...";


            try {

                const response =
                    await fetch(
                        `/api/orders/customer?email=${encodeURIComponent(email)}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to load orders"
                    );

                }


                const orders =
                    await response.json();


                if (
                    !orders ||
                    orders.length === 0
                ) {

                    ordersList.innerHTML = `

                        <div class="empty-state">

                            <h2>
                                No orders found
                            </h2>

                            <p>
                                We couldn't find any
                                orders for this email
                                address.
                            </p>

                            <a
                                href="/shop.html"
                                class="shop-button"
                            >
                                Continue Shopping
                            </a>

                        </div>

                    `;

                    return;
                }


                renderOrders(orders);


            } catch (error) {

                console.error(
                    "Error loading orders:",
                    error
                );


                showMessage(
                    "Something went wrong while loading your orders."
                );


            } finally {

                findOrdersButton.disabled = false;

                findOrdersButton.textContent =
                    "Find Orders";

            }

        }



        /* =================================================
           RENDER ORDERS
           ================================================= */

        function renderOrders(orders) {

            ordersList.innerHTML =
                orders
                    .map(order => {

                        const items =
                            order.items || [];


                        let itemsText =
                            "No items listed";


                        if (items.length > 0) {

                            const names =
                                items.map(item =>
                                    item.product?.name ||
                                    "Product"
                                );


                            itemsText =
                                names.join(" · ");

                        }


                        if (items.length > 1) {

                            itemsText +=
                                ` · ${items.length} items`;

                        }


                        return `

                            <article
                                class="order-card"
                            >

                                <div
                                    class="order-card-top"
                                >

                                    <div>

                                        <div
                                            class="order-number"
                                        >
                                            Order #${order.id}
                                        </div>


                                        <div
                                            class="order-date"
                                        >
                                            ${formatDate(order.createdAt)}
                                        </div>

                                    </div>


                                    <span
                                        class="status-badge"
                                    >
                                        ${formatStatus(order.status)}
                                    </span>

                                </div>


                                <div
                                    class="order-card-middle"
                                >

                                    <div
                                        class="items-preview"
                                    >
                                        ${itemsText}
                                    </div>


                                    <div
                                        class="order-total"
                                    >
                                        ₹${formatAmount(order.totalAmount)}
                                    </div>

                                </div>


                                <div
                                    class="order-card-bottom"
                                >

                                    <a
                                        href="/track-order.html?orderId=${order.id}"
                                        class="track-button"
                                    >
                                        Track Order
                                    </a>

                                </div>

                            </article>

                        `;

                    })
                    .join("");

        }



        /* =================================================
           EVENTS
           ================================================= */

        findOrdersButton.addEventListener(
            "click",
            loadOrders
        );


        emailInput.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {

                    loadOrders();

                }

            }
        );

    </script>

</body>

</html>
