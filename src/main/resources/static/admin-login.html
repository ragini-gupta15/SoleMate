<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | SoleMate</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f2;
            color: #171717;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: #171717;

            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .logo-mark {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #171717;
            color: #ffffff;

            font-size: 18px;
            font-weight: 700;
        }

        .brand-label {
            margin-top: 10px;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: #777;
        }

        .login-card {
            background: #ffffff;

            border: 1px solid #e5e5e2;
            border-radius: 22px;

            padding: 36px;

            box-shadow:
                0 18px 50px rgba(0, 0, 0, 0.06);
        }

        .login-card h1 {
            font-size: 28px;
            line-height: 1.15;

            letter-spacing: -1px;

            margin-bottom: 9px;
        }

        .login-card > p {
            color: #707070;
            font-size: 14px;
            line-height: 1.6;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;

            height: 48px;

            padding: 0 48px 0 14px;

            border: 1px solid #dcdcd8;
            border-radius: 11px;

            background: #ffffff;

            font-size: 14px;
            color: #171717;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: #171717;

            box-shadow:
                0 0 0 3px rgba(23, 23, 23, 0.07);
        }

        .password-toggle {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #777;

            cursor: pointer;

            font-size: 12px;
            font-weight: 600;
        }

        .password-toggle:hover {
            color: #171717;
        }

        .error-message {
            display: none;

            margin-bottom: 18px;
            padding: 12px 14px;

            border-radius: 10px;

            background: #fff1f1;
            border: 1px solid #f0cccc;

            color: #b42318;

            font-size: 13px;
            line-height: 1.4;
        }

        .login-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 12px;

            background: #171717;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .login-button:hover {
            background: #2b2b2b;
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: #777;
            text-decoration: none;

            font-size: 13px;
        }

        .back-link:hover {
            color: #171717;
        }

        .security-note {
            margin-top: 22px;

            text-align: center;

            color: #8a8a8a;

            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .login-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">

        <div class="brand">

            <a href="/" class="logo">
                <span class="logo-mark">S</span>
                <span>SoleMate</span>
            </a>

            <div class="brand-label">
                Admin Portal
            </div>

        </div>

        <section class="login-card">

            <h1>Welcome back.</h1>

            <p>
                Sign in to manage products, inventory,
                orders and store operations.
            </p>

            <div
                id="loginError"
                class="error-message"
            >
                Invalid username or password.
                Please try again.
            </div>

            <form action="/login" method="post">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter admin username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter admin password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Sign in to Admin
                </button>

            </form>

            <a
                href="/"
                class="back-link"
            >
                ← Back to SoleMate Store
            </a>

            <div class="security-note">
                Protected by Spring Security
            </div>

        </section>

    </main>

    <script>
        const passwordInput =
            document.getElementById("password");

        const passwordToggle =
            document.getElementById("passwordToggle");

        passwordToggle.addEventListener(
            "click",
            () => {

                const isPassword =
                    passwordInput.type === "password";

                passwordInput.type =
                    isPassword
                        ? "text"
                        : "password";

                passwordToggle.textContent =
                    isPassword
                        ? "Hide"
                        : "Show";
            }
        );

        const params =
            new URLSearchParams(window.location.search);

        if (params.has("error")) {
            document.getElementById("loginError")
                .style.display = "block";
        }
    </script>

</body>
</html>
